server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Keep the former Vietnamese URL discoverable while consolidating indexing
    # signals on the English, canonical careers URL.
    location = /tuyen-dung {
        return 301 /careers;
    }

    # SPA fallback - serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets (from Vite build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
